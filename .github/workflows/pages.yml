name: Test and publish game

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build and check game logic and assets
        run: npm test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Check the game in a browser
        run: npm run test:browser
      - name: Configure Pages
        if: github.event_name != 'pull_request' && vars.PAGES_ENABLED == 'true'
        uses: actions/configure-pages@v5
      - name: Upload built game
        if: github.event_name != 'pull_request' && vars.PAGES_ENABLED == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && vars.PAGES_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish game
        id: deployment
        uses: actions/deploy-pages@v4
