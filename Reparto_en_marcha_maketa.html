}

function shuffled(items) {
  const result=[...items];
  for (let i=result.length-1;i>0;i--) {
    const j=Math.floor(Math.random()*(i+1));
    [result[i],result[j]]=[result[j],result[i]];
  }

}
function makeRoutes() {

function createTraffic() {
  traffic = ROUTE_LANES.flatMap((data) => {
    const length = data.length*CELL;
    const gap = data.gap*CELL;
    const count = Math.ceil((WIDTH+2*length)/gap);
    const lane = {...data,length,period:gap*count};
    return Array.from({length:count},(_,index) => ({
      lane,index,offset:mod(index*gap+(data.phase+route*.73)*CELL,lane.period)
    }));
  });
}
function trafficPosition(vehicle,time) {
  const {lane,offset} = vehicle;
  const distance = mod(offset+lane.speed*CELL*time,lane.period)-lane.length;
  return lane.dir===1 ? distance : WIDTH-distance;
}
function avatarPosition() {
  const progress = step ? step.ticks/STEP_TICKS : 0;
  return {
    x:center(player.x+(step ? (step.x-player.x)*progress : 0)),
    y:center(player.y+(step ? (step.y-player.y)*progress : 0)),
    lift:step && !reduced.matches ? 5*Math.sin(Math.PI*progress) : 0

}
function axisWindow(from,to,radius) {
  const delta = to-from;
  if (Math.abs(delta)<1e-8) return Math.abs(from)<=radius ? [-Infinity,Infinity] : [Infinity,-Infinity];
  const first = (-radius-from)/delta;
  const last = (radius-from)/delta;
  return [Math.min(first,last),Math.max(first,last)];
}
function hitsTraffic(before,after,previousTime) {

    const x = trafficPosition(vehicle,now);
    const previousX = trafficPosition(vehicle,previousTime);
    if (Math.abs(x-previousX)>lane.period/2) return false;
    const y = center(lane.row);
    const [enterX,exitX] = axisWindow(before.x-previousX,after.x-x,HALF_COURIER.x+lane.length/2);
    const [enterY,exitY] = axisWindow(before.y-y,after.y-y,HALF_COURIER.y+.30*CELL);
    return Math.max(0,enterX,enterY)<=Math.min(1,exitX,exitY);

}
function draw() {
  ctx.drawImage(background,0,0,WIDTH,HEIGHT);
  brush=ctx;
  for (const vehicle of traffic) {
    const {lane,index} = vehicle;
    const x = trafficPosition(vehicle,now);
    if (x<-lane.length || x>WIDTH+lane.length) continue;
    lane.sprite(x,center(lane.row),lane,lane.colors[index%lane.colors.length],index);
  }

function paintMap() {
  const scale=Math.min(3,Math.max(1,devicePixelRatio||1)*Math.max(1,canvas.clientWidth/WIDTH));
  canvas.width=background.width=Math.round(WIDTH*scale);
  canvas.height=background.height=Math.round(HEIGHT*scale);
  for(const target of [ctx,paint]) target.setTransform(canvas.width/WIDTH,0,0,canvas.height/HEIGHT,0,0);
  brush=paint;
  scene();

function setHold(next) {
  if (hold) buttons[hold.direction].classList.remove("is-held");
  hold=next;
  if (hold) buttons[hold.direction].classList.add("is-held");
}
function clearInput() {

}
function showNotice(message) {
  clearTimeout(noticeTimeout);
  $("notice").textContent=message;
  $("notice").hidden=false;
  noticeTimeout=setTimeout(() => { $("notice").hidden=true; },2000);
}
function move(direction) {
  if (dialog.open || mode!=="playing" || activeSpeech) return;
  if (step) { queued=direction; return; }
  const [dx,dy]=directions[direction];
  const x=player.x+dx;
  const y=player.y+dy;
  if (y===1 && player.y===2 && direction==="up") {
    const gate=GATES.indexOf(player.x);
    if (gate!==-1) {
      const order=routes[route];
      finishOrder(order.order[gate]===order.target?"delivered":"missed");
    }

}
function endHold(source) {

}
function updateHud() {

  const missed=outcomes.length-delivered;
  $("progress").setAttribute("aria-label",delivered+" de 3 entregas. "+missed+" sin entregar.");
  $("progress").querySelectorAll(".dot").forEach((mark,index) => {
    const result=outcomes[index];
    mark.classList.toggle("done",result==="delivered");
    mark.classList.toggle("missed",result==="missed");
    mark.classList.toggle("current",!result && index===route);
  });
  $("lives").setAttribute("aria-label",attempts+" intentos");
  $("lives").querySelectorAll(".life").forEach((mark,index) => mark.classList.toggle("lost",index>=attempts));

  const voice=voices.find((item) => item.lang.toLowerCase()==="es-es") ||
    voices.find((item) => item.lang.toLowerCase().startsWith("es"));
  stopSpeech();
  if (!voice || !window.SpeechSynthesisUtterance) { showText(); return; }
  clearInput();
  const speech=new SpeechSynthesisUtterance(orderText());
  activeSpeech=speech;
  speech.voice=voice;
  speech.lang=voice.lang;
  speech.rate=.92;
  const fallback=() => {
    if (speech!==activeSpeech) return;
    stopSpeech();
    showText();
  };
  speech.onstart=() => {
    if (speech!==activeSpeech) return;
    clearTimeout(speechTimeout);
    speechTimeout=setTimeout(fallback,7000);
  };
  speech.onend=() => {
    if (speech!==activeSpeech) return;
    clearTimeout(speechTimeout);
    activeSpeech=null;
  };
